[package]
name = "xreald"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
authors = ["Kostiantyn Andriiuk <konstantin@andriyuk.com>"]
repository = "https://github.com/kotXio/xreald"
readme = "README.md"
rust-version = "1.99"
description = "A bounded, demand-driven XREAL telemetry and control-read service"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
